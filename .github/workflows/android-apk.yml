name: Build and Release WebOS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "android-v*"

permissions:
  contents: write

concurrency:
  group: webos-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build WebOS APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirrored GitLab source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install WebOS dependencies
        run: npm install

      - name: Install Capacitor Android tooling
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Configure hosted WebOS Android wrapper
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.openfiddles.webos",
            "appName": "WebOS",
            "webDir": "public",
            "server": {
              "url": "https://web-os-git-main-xistu.vercel.app",
              "cleartext": false,
              "allowNavigation": [
                "web-os-git-main-xistu.vercel.app",
                "*.supabase.co",
                "*.google.com",
                "*.github.com",
                "*.gitlab.com",
                "*.discord.com",
                "challenges.cloudflare.com"
              ]
            },
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebOS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: WebOS Android ${{ github.ref_name }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
