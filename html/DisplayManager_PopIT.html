<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS Launcher</title>
    <link rel="stylesheet" href="../css/universal_css_native_stuff.css"/>
    <link rel="stylesheet" href="../css/display/regular_theme.css"/>
    <link rel="manifest" href="../site.webmanifest"/>
</head>
<body>

<!-- ---------- WINDOW TEMPLATE ---------- -->

<div class="window-shell glass hidden" id="WindowTemplate" role="dialog" aria-labelledby="WindowTitle-Template" aria-hidden="true">
    <!-- Active resizing anchors on all outer boundaries -->
    <div class="resize-handle top" data-direction="n"></div>
    <div class="resize-handle right" data-direction="e"></div>
    <div class="resize-handle bottom" data-direction="s"></div>
    <div class="resize-handle left" data-direction="w"></div>
    <div class="resize-handle corner-se" data-direction="se"></div>

    <!-- Titlebar / Window Header -->
    <header class="window-titlebar">
        <div class="window-title-content">
            <img class="window-icon" src="/icons/default-app.png" alt="" aria-hidden="true">
            <span id="WindowTitle-Template" class="window-title-text">Nothing...</span>
        </div>
        <nav class="window-controls" aria-label="Window Actions">
            <button class="win-btn minimize" aria-label="Minimize Window" title="Minimize">
                <svg width="12" height="12" viewBox="0 0 12 12"><rect fill="currentColor" x="1" y="5" width="10" height="2"/></svg>
            </button>
            <button class="win-btn maximize" aria-label="Maximize Window" title="Maximize">
                <svg width="12" height="12" viewBox="0 0 12 12"><rect fill="none" stroke="currentColor" stroke-width="2" x="2" y="2" width="8" height="8"/></svg>
            </button>
            <button class="win-btn close" aria-label="Close Window" title="Close">
                <svg width="12" height="12" viewBox="0 0 12 12"><path fill="none" stroke="currentColor" stroke-width="2" d="M2,2 L10,10 M10,2 L2,10"/></svg>
            </button>
        </nav>
    </header>

    <!-- App / Window Content Frame -->
    <main class="window-body">
        <div class="window-content-fallback">
            <p>Nothing Interesting... :[</p>
        </div>
    </main>
</div>


<!-- ---------- DESKTOP + TASKBAR + DOCK ---------- -->

<div id="Desktop">

    <div id="taskbar" role="contentinfo">
        <div id="taskbar-left">
            <button id="open-launcher" aria-label="Open launcher" title="Open launcher">☰</button>
            <span>WebOS Launcher</span>
        </div>
        <div id="taskbar-apps" role="toolbar" aria-label="Open windows"></div>
        <div id="taskbar-right">
            <button class="StatusButton" id="network-status" title="Network status">Online</button>
            <button class="StatusButton" id="clock" title="System time"></button>
        </div>
    </div>

    <!-- This empty panel zone is where active application window elements dynamically spawn -->
    <div id="window-workspace"></div>

    <div id="dock" class="dock-glass" aria-label="Favorite apps"></div>

</div>

<!-- ---------- FULLSCREEN LAUNCHER ---------- -->

<div id="Launcher" class="LauncherFS">
    <div class="LauncherInner glass">
        <div class="LauncherHeader">
            <span>Launcher</span>
            <span>Press Esc to close</span>
        </div>
        <!-- FIX: Cleaned duplicate layout inputs and mapped accessibility relationships cleanly -->
        <input class="LauncherSearch" id="launcher-search" type="search" placeholder="Search apps" autocomplete="off" aria-controls="launcher-grid">
        <div class="LauncherGrid" id="launcher-grid"></div>
    </div>
</div>

<!-- ---------- SYSTEM RUNTIME SCRIPTS ---------- -->
<script src="../js/os/desktop/filesystem.js"></script>
<script src="../js/os/desktop/app-registry.js"></script>
<script src="../js/os/window/WindowManager.js"></script>
<script src="../js/boot/Popcorn.boot.js"></script>


</body>
</html>
