<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080d16">
    <title>WebOS</title>
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" type="image/x-icon" href="/images/icons/3.png">
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }
        #os-entry {
            display: block;
            width: 100%;
            height: 100%;
            height: 100dvh;
            border: 0;
            background: #080d16;
        }
    </style>
</head>
<body>
    <iframe
        id="os-entry"
        title="WebOS"
        scrolling="no"
    ></iframe>
    <script>
        (() => {
            const frame = document.getElementById("os-entry");
            const touchDevice = navigator.maxTouchPoints > 0 ||
                window.matchMedia("(pointer: coarse)").matches;
            const mobileUA = /Android|iPhone|iPod|Mobile|IEMobile|Windows Phone/i.test(navigator.userAgent);
            const screenSize = Math.min(
                window.screen?.width || window.innerWidth,
                window.screen?.height || window.innerHeight
            );
            const compactTouchScreen = touchDevice && screenSize <= 900;
            const isMobile = mobileUA || compactTouchScreen;

            frame.src = isMobile
                ? "/mobile.html"
                : "/html/BootScreen_popcorn.html";
            frame.title = isMobile ? "WebOS mobile experience" : "WebOS desktop boot";
        })();
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
