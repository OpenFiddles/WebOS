<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS</title>
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" type="image/x-icon" href="images/icons/3.png">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #boot-screen {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
    <!--Sandboxed and load with no problems :] -->
    <iframe
        id="boot-screen"
        src="/html/BootScreen_popcorn.html"
        title="WebOS boot screen"
        allow="accelerometer; ambient-light-sensor; autoplay; battery; camera; clipboard-read; clipboard-write; display-capture; encrypted-media; fullscreen; gamepad; geolocation; gyroscope; hid; identity-credentials-get; idle-detection; local-fonts; magnetometer; microphone; midi; otp-credentials; payment; picture-in-picture; publickey-credentials-get; screen-wake-lock; serial; usb; xr-spatial-tracking
        "
        allowfullscreen="true"
        frameborder="0"
        scrolling="no"
        allowtransparency="true"
        
    ></iframe>
    <script defer src="../_vercel/insights/script.js"></script>
    <script defer src="../_vercel/speed-insights/script.js"></script>
    <script defer src="../_vercel/toolbar"></script>
    <script src="/js/app.js"></script>
</body>
</html>
