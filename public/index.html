    <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"SoftwareApplication",
      "name":"WebOS",
      "operatingSystem":"Web Browser",
      "applicationCategory":"UtilitiesApplication",
      "license":"https://www.gnu.org/licenses/gpl-3.0.html",
      "author":{"@type":"Organization","name":"OpenFiddles"},
      "offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}
    }
    </script>
    <style>
      *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
      #os-entry{display:block;width:100%;height:100%;height:100dvh;border:0;background:#080d16}
    </style>
</head>
<body>
    <iframe id="os-entry" title="WebOS" scrolling="no" allow="fullscreen"></iframe>
    <script>
      (() => {
        const frame=document.getElementById("os-entry");
        const mobileUA=/Android|iPhone|iPad|iPod|Mobile|IEMobile|Windows Phone/i.test(navigator.userAgent);
        const compactTouch=(navigator.maxTouchPoints>0||matchMedia("(pointer: coarse)").matches)&&Math.min(innerWidth,screen?.width||innerWidth)<=820;
        frame.src=(mobileUA||compactTouch)?"/html/mobile/mobileLauncher.html":"/html/BootScreen_popcorn.html";
        frame.title=(mobileUA||compactTouch)?"WebOS Mobile Launcher":"WebOS desktop";
        let queued=[];
        const deliver=()=>{if(!frame.contentWindow||!queued.length)return;try{if(!frame.contentWindow.location.pathname.endsWith("/DisplayManager_PopIT.html"))return;}catch(_){return;}frame.contentWindow.postMessage({type:"WEBOS_HOST_FILES",files:queued},"*");queued=[];};
        frame.addEventListener("load",deliver);
        if("launchQueue" in window && typeof window.launchQueue.setConsumer==="function"){
          window.launchQueue.setConsumer(async params=>{
            const files=[];
            for(const handle of params.files||[]){try{files.push(await handle.getFile());}catch(error){console.warn("WebOS could not read a launched file",error);}}
            if(files.length){queued.push(...files);deliver();}
          });
        }
        const share=new URLSearchParams(location.search);
        if(share.has("title")||share.has("text")||share.has("url")){
          queued.push(new File([["Title: "+(share.get("title")||""),"",share.get("text")||"",share.get("url")||""].filter(Boolean).join("\n")],"Shared-content.txt",{type:"text/plain"}));
          history.replaceState({}, "", "/");
        }
      })();
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
