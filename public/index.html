          "@context": "https://schema.org",

    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
        #os-entry { display: block; width: 100%; height: 100%; height: 100dvh; border: 0; background: #080d16; }
    </style>
</head>
<body>
    <iframe id="os-entry" title="WebOS" scrolling="no" allow="fullscreen"></iframe>
    <script>
        (() => {
            const frame = document.getElementById("os-entry");
            const mobileUA = /Android|iPhone|iPad|iPod|Mobile|IEMobile|Windows Phone/i.test(navigator.userAgent);
            const compactTouch = (navigator.maxTouchPoints > 0 || matchMedia("(pointer: coarse)").matches) &&
                Math.min(window.innerWidth, window.screen?.width || window.innerWidth) <= 820;
            const isMobile = mobileUA || compactTouch;
            frame.src = isMobile ? "/html/mobile/mobileLauncher.html" : "/html/BootScreen_popcorn.html";
            frame.title = isMobile ? "WebOS Mobile Launcher" : "WebOS desktop";
        })();
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <script src="/js/app.js"></script>
</body>
