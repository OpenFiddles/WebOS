<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS Launcher</title>
    <link rel="stylesheet" href="../css/universal_css_native_stuff.css"/>
    <link rel="stylesheet" href="../css/display/regular_theme.css"/>
    <link rel="manifest" href="../site.webmanifest"/>
</head>
<body>
<svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
 <filter id="webos-glass-refraction" x="-15%" y="-15%" width="130%" height="130%">
  <feTurbulence type="fractalNoise" baseFrequency="0.018 0.026" numOctaves="2" seed="8" result="glass-noise"/>
  <feDisplacementMap in="SourceGraphic" in2="glass-noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
</svg>

<!-- ======================================================================= -->
<!-- SYSTEM APPARATUS TEMPLATES                                              -->
<!-- ======================================================================= -->

<!-- A strict template container prevents layout IDs from colliding with real active DOM nodes -->
<template id="WindowTemplate">
    <div class="window-shell glass" role="dialog" aria-modal="false">
        <!-- Interactive Pointer Boundary Resizers -->
        <div class="resize-handle top" data-direction="n"></div>
        <div class="resize-handle right" data-direction="e"></div>
        <div class="resize-handle bottom" data-direction="s"></div>
        <div class="resize-handle left" data-direction="w"></div>
        <div class="resize-handle corner-se" data-direction="se"></div>

        <!-- Window Chrome / Management Header -->
        <header class="window-titlebar">
            <div class="window-title-content">
                <img class="window-icon" src="" alt="" aria-hidden="true">
                <span class="window-title-text">Application</span>
            </div>
            <nav class="window-controls" aria-label="Window Management Actions">
                <button class="win-btn minimize" aria-label="Minimize Window" title="Minimize">
                    <svg width="12" height="12" viewBox="0 0 12 12"><rect fill="currentColor" x="1" y="5" width="10" height="2"/></svg>
                </button>
                <button class="win-btn maximize" aria-label="Maximize Window" title="Maximize">
                    <svg width="12" height="12" viewBox="0 0 12 12"><rect fill="none" stroke="currentColor" stroke-width="2" x="2" y="2" width="8" height="8"/></svg>
                </button>
                <button class="win-btn close" aria-label="Close Window" title="Close">
                    <svg width="12" height="12" viewBox="0 0 12 12"><path fill="none" stroke="currentColor" stroke-width="2" d="M2,2 L10,10 M10,2 L2,10"/></svg>
                </button>
            </nav>
        </header>

        <!-- Dynamic Sandbox App Content Container -->
        <main class="window-body">
            <!-- Iframes are dynamically generated here via custom app-registry scripts -->
        </main>
    </div>
</template>

<!-- ======================================================================= -->
<!-- DESKTOP OPERATING ENVIRONMENT                                           -->
<!-- ======================================================================= -->

<div id="Desktop">

    <div class="desktop-atmosphere" aria-hidden="true"><span class="atmosphere-orb orb-one"></span><span class="atmosphere-orb orb-two"></span><span class="atmosphere-grid"></span></div>
    <section id="desktop-icons" aria-label="Desktop shortcuts">
      <button class="DesktopShortcut" type="button" data-desktop-app="files"><span class="DesktopShortcutIcon">📁</span><span>Files</span></button>
      <button class="DesktopShortcut" type="button" data-desktop-app="browser"><span class="DesktopShortcutIcon">🌐</span><span>Browser</span></button>
      <button class="DesktopShortcut" type="button" data-desktop-app="notes"><span class="DesktopShortcutIcon">📝</span><span>Notes</span></button>
      <button class="DesktopShortcut" type="button" data-desktop-app="alpine"><span class="DesktopShortcutIcon">🖥️</span><span>FlairOS</span></button>
      <button class="DesktopShortcut" type="button" data-desktop-app="appcreator"><span class="DesktopShortcutIcon">🧩</span><span>App Creator</span></button>
    </section>

    <!-- Global System Navigation Shell -->
    <header id="taskbar" role="banner">
        <div id="taskbar-left">
            <button id="open-launcher" aria-label="Open Application Launcher" aria-haspopup="true" aria-expanded="false" title="Launcher Menu">☰</button>
            <span class="system-brand-text">WebOS</span>
        </div>
        <nav id="taskbar-apps" role="navigation" aria-label="Active Workspace Windows"></nav>
        <div id="taskbar-right">
            <button class="StatusButton" id="network-status" title="System Connection Status">Online</button>
            <time class="StatusButton" id="clock" title="System Calendar Time"></time>
        </div>
    </header>

    <!-- Isolated Window Execution Layer -->
    <main id="window-workspace" aria-label="Desktop Workspace Layer"></main>

    <!-- Standard Dock Panel Launcher Pinboard -->
    <nav id="dock" class="dock-glass" aria-label="Pinned Fast-Launch Applications"></nav>

</div>

<!-- ======================================================================= -->
<!-- FULLSCREEN OVERLAY COMPONENT                                           -->
<!-- ======================================================================= -->

<section id="Launcher" class="LauncherFS hidden" role="dialog" aria-modal="true" aria-label="Application Launcher Grid">
    <div class="LauncherInner glass">
        <header class="LauncherHeader">
            <h1>Launcher</h1>
            <kbd class="sys-shortcut-hint">Press Esc to exit</kbd>
        </header>
        <div class="search-wrapper">
            <input class="LauncherSearch" id="launcher-search" type="search" placeholder="Search applications..." autocomplete="off" aria-controls="launcher-grid">
        </div>
        <div class="LauncherGrid" id="launcher-grid" role="feed" aria-busy="false"></div>
    </div>
</section>

<!-- ======================================================================= -->
<!-- CORE OS ARCHITECTURE RUNTIMES                                           -->
<!-- ======================================================================= -->
<script defer src="../js/os/window/Launcher.js"></script>
<script defer src="../js/os/desktop/filesystem.js"></script>
<script defer src="../js/os/desktop/app-registry.js"></script>
<script defer src="../js/os/window/WindowManager.js"></script>
<script defer src="../js/boot/Popcorn.boot.js"></script>
<script defer src="../js/os/window/SystemApps.js"></script>
<script defer src="../js/os/window/Documentation.js"></script>
<script defer src="../js/os/window/AnimationStudio.js"></script>
</body>
</html>
