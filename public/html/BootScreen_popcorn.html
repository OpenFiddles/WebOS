<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebPopcorn Boot</title>
    <!-- FIX: Restored correct relation parameter 'rel="stylesheet"' to load styles properly -->
    <link rel="stylesheet" href="../css/boot/boot.css"/>
</head>

<body>

<!-- ---------- CORE CORE BOOTLOADER VISUAL CANVAS ---------- -->
<main class="boot-center" id="boot" aria-labelledby="boot-title">
    <div class="popcorn-logo" id="boot-title">WebOS</div>
    <div class="loading-bar">
        <!-- Progress track state modifiers wired here -->
        <div class="loading-fill" id="loading-progress" role="progressbar" aria-label="Starting WebOS" style="width: 10%;"></div>
    </div>
    <p class="boot-status" id="boot-status" aria-live="polite">Starting desktop services...</p>
    <!-- FIX: Initialized as disabled to protect background caching routines from user interruption -->
    <button class="skip-boot" id="skip-boot" type="button" disabled>Please wait...</button>
</main>

<!-- ---------- LOCAL STORAGE AUTHENTICATION PORTAL ---------- -->
<main class="auth-screen" id="auth-screen" aria-labelledby="auth-title" style="display: none;">
    <section class="auth-card">
        <h1 id="auth-title">Welcome to WebOS</h1>
        <p class="auth-copy" id="auth-copy">Sign in or create a WebOS account to continue.</p>
        
        <form class="auth-form" id="auth-form">
            <label>Email<input id="auth-email" type="email" autocomplete="email" required></label>
            <label>Password<input id="auth-password" type="password" minlength="8" autocomplete="new-password" required></label>
            <button type="submit" id="auth-submit">Create account</button>
        </form>
        
        <div class="provider-row">
            <button class="provider-button" type="button" data-provider="google">Continue with Google</button>
            <button class="provider-button" type="button" data-provider="discord">Continue with Discord</button>
            <button class="provider-button" type="button" data-provider="github">Continue with GitHub</button>
            <button class="provider-button" type="button" data-provider="gitlab">Continue with GitLab</button>
        </div>
        
        <button class="auth-switch" type="button" id="auth-switch">Already have an account? Sign in</button>
        <button class="auth-switch" type="button" id="auth-reset">Forgot password?</button>
        <div id="turnstile-container" style="display:none;margin:12px auto;min-height:0"></div>
        <button class="guest-button" type="button" id="guest-button">Continue as guest</button>
        <p class="auth-status" id="auth-status" aria-live="polite"></p>
    </section>
</main>

<script src="../js/os/core/InterfaceMode.js"></script>
<script src="../js/os/desktop/CloudSync.js"></script>
<script>
    const boot = document.getElementById("boot");
    const status = document.getElementById("boot-status");
    const skipButton = document.getElementById("skip-boot");
    const progressFill = document.getElementById("loading-progress");
    const authScreen = document.getElementById("auth-screen");
    const authForm = document.getElementById("auth-form");
    const authTitle = document.getElementById("auth-title");
    const authCopy = document.getElementById("auth-copy");
    const authSubmit = document.getElementById("auth-submit");
    const authSwitch = document.getElementById("auth-switch");
    const authStatus = document.getElementById("auth-status");
    const authEmail = document.getElementById("auth-email");
    const authPassword = document.getElementById("auth-password");
    const authReset = document.getElementById("auth-reset");
    const guestButton = document.getElementById("guest-button");
    const turnstileContainer = document.getElementById("turnstile-container");
    let redirected = false;
    let signingIn = false;
    let captchaToken = null;
    let captchaWidgetId = null;
    let captchaLoader = null;

    function showMessage(message,success=false){
        authStatus.className=success?"auth-status success":"auth-status";
        authStatus.textContent=message||"";
    }
    function setBusy(busy){
        authSubmit.disabled=busy;
        guestButton.disabled=busy;
        document.querySelectorAll("[data-provider]").forEach(button=>button.disabled=busy);
        authReset.disabled=busy;
    }
    async function loadTurnstile(){
        const siteKey=window.WebOSCloud?.getCaptchaSiteKey?.();
        if(!siteKey){turnstileContainer.style.display="none";return;}
        turnstileContainer.style.display="block";
        if(!window.turnstile){
            if(!captchaLoader){
                captchaLoader=new Promise((resolve,reject)=>{
                    const script=document.createElement("script");
                    script.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
                    script.async=true;script.defer=true;
                    script.onload=resolve;script.onerror=()=>reject(new Error("Could not load the Turnstile security check."));
                    document.head.appendChild(script);
                });
            }
            await captchaLoader;
        }
        if(captchaWidgetId===null){
            captchaWidgetId=window.turnstile.render(turnstileContainer,{
                sitekey:siteKey,
                theme:"auto",
                callback:token=>{captchaToken=token;},
                "expired-callback":()=>{captchaToken=null;},
                "error-callback":()=>{captchaToken=null;showMessage("Security check failed to load. Please retry.");}
            });
        }
    }
    function consumeCaptcha(){
        const token=captchaToken;
        if(window.WebOSCloud?.getCaptchaSiteKey?.()&&!token)throw new Error("Complete the security check first.");
        return token;
    }
    function resetCaptcha(){
        captchaToken=null;
        if(captchaWidgetId!==null&&window.turnstile){
            try{window.turnstile.reset(captchaWidgetId);}catch(_){}
        }
    }
    async function warmDesktopAssets(){
        status.textContent="Preparing WebOS services...";
        if(progressFill)progressFill.style.width="70%";
        await new Promise(resolve=>setTimeout(resolve,350));
        status.textContent="Checking your WebOS account...";
        if(progressFill)progressFill.style.width="100%";
        await onBootComplete();
    }
    async function onBootComplete(){
        skipButton.disabled=false;
        skipButton.textContent="Continue";
        try{
            await window.WebOSCloud?.ready;
            const cloud=window.WebOSCloud?.getStatus?.();
            if(cloud?.mode==="ready"&&cloud.user){
                sessionStorage.setItem("webos-session",cloud.user.email||cloud.user.id);
                openDesktop();
                return;
            }
            showAuth();
            if(cloud?.mode!=="ready"){
                showMessage(cloud?.message||"WebOS account services are unavailable. Please retry shortly.");
                setBusy(true);
            }else{
                await loadTurnstile().catch(error=>showMessage(error.message));
            }
        }catch(error){
            showAuth();
            showMessage(error?.message||"Could not initialize WebOS authentication.");
            setBusy(true);
        }
    }
    function showAuth(){
        boot.style.display="none";
        authScreen.style.display="block";
        authScreen.classList.add("active");
        if(!authEmail.value)authEmail.focus();
    }
    function setAuthMode(signIn){
        signingIn=signIn;
        authTitle.textContent=signIn?"Sign in to WebOS":"Create your WebOS account";
        authCopy.textContent=signIn?"Use your WebOS account credentials.":"Create an account to sync your WebOS settings and files.";
        authSubmit.textContent=signIn?"Sign in":"Create account";
        authSwitch.textContent=signIn?"Need an account? Sign up":"Already have an account? Sign in";
        authPassword.autocomplete=signIn?"current-password":"new-password";
        authReset.textContent="Forgot password?";
        showMessage("");
    }
    function openDesktop(){
        if(redirected)return;
        redirected=true;
        status.textContent="Opening WebOS...";
        const state=window.WebOSInterfaceMode?.apply("boot-complete")||{mode:"desktop",formFactor:"desktop",layout:"desktop"};
        const destination=state.mode==="mobile"
            ?"mobile/mobileLauncher.html"
            :"DisplayManager_PopIT.html"+(state.layout==="hybrid"?"?mode=hybrid":"");
        setTimeout(()=>{window.location.href=destination;},250);
    }
    async function withAuthAction(action){
        setBusy(true);
        showMessage("Verifying...");
        try{
            await window.WebOSCloud?.ready;
            await loadTurnstile();
            const token=consumeCaptcha();
            const result=await action(token);
            return result;
        }catch(error){
            showMessage(error?.message||"Authentication failed.");
            await loadTurnstile().catch(()=>{});
            return null;
        }finally{
            resetCaptcha();
            setBusy(false);
            if(window.WebOSCloud?.getCaptchaSiteKey?.())await loadTurnstile().catch(()=>{});
        }
    }
    document.getElementById("skip-boot").addEventListener("click",showAuth);
    authSwitch.addEventListener("click",()=>setAuthMode(!signingIn));
    authReset.addEventListener("click",()=>withAuthAction(async token=>{
        await window.WebOSCloud.resetPassword(authEmail.value.trim().toLowerCase(),token);
        showMessage("If that account exists, a password reset email has been sent.",true);
        return true;
    }));
    document.querySelectorAll("[data-provider]").forEach(button=>{
        button.addEventListener("click",()=>withAuthAction(token=>window.WebOSCloud.signInWithOAuth(button.dataset.provider,token)));
    });
    guestButton.addEventListener("click",()=>withAuthAction(async token=>{
        const result=await window.WebOSCloud.signInAsGuest(token);
        finishAuth(result.user);
        return result;
    }));
    authForm.addEventListener("submit",event=>{
        event.preventDefault();
        withAuthAction(async token=>{
            const email=authEmail.value.trim().toLowerCase();
            const password=authPassword.value;
            const result=signingIn
                ?await window.WebOSCloud.signIn(email,password,token)
                :await window.WebOSCloud.signUp(email,password,"",token);
            if(result.session&&result.user){finishAuth(result.user);}
            else showMessage("Account created. Check your email to confirm it, then return here to sign in.",true);
            return result;
        });
    });
    function finishAuth(user){
        sessionStorage.setItem("webos-session",user?.email||user?.id||"webos-user");
        showMessage("Signed in. Opening WebOS...",true);
        setTimeout(openDesktop,350);
    }
    window.addEventListener("keydown",event=>{
        if(authScreen.style.display==="none"&&!skipButton.disabled&&(event.key==="Enter"||event.key===" ")){
            showAuth();
        }
    });
    warmDesktopAssets();
</script>


<!--<script src="../js/boot/Popcorn.boot.js"></script>-->

</body>
</html>
