<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080d16">
    <title>WebOS Mobile</title>
    <style>
        :root { color-scheme: dark; background: #080d16; }
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            margin: 0;
            overflow: hidden;
            background: #080d16;
        }
        #mobile-home {
            display: block;
            width: 100%;
            height: 100%;
            height: 100dvh;
            min-height: 0;
            border: 0;
            background: #080d16;
        }
    </style>
</head>
<body>
    <iframe
        id="mobile-home"
        src="/html/mobileHome.html"
        title="WebOS mobile home"
        allow="fullscreen"
        scrolling="no"
    ></iframe>
</body>
</html>
